# Only bindings that differ from herdr's defaults are set; session, tab and
# rename bindings rely on herdr defaults, which already mirror the tmux
# equivalents (prefix+c new tab, prefix+shift+n new workspace,
# prefix+shift+t / prefix+shift+w rename tab / workspace).

onboarding = false

[terminal]
shell_mode = "auto"
kitty_graphics = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"


# tmux: M-Left/M-Right = previous/next window; kept alongside herdr's prefix+p/n
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

next_workspace     = "alt+down"
previous_workspace = "alt+up"

# --- tmux muscle-memory aliases (secondary keys; prune once the herdr defaults stick) ---
# settings takes prefix+shift+s, leaving prefix+s for the tmux session-picker key.
rename_workspace = ["prefix+shift+w", "prefix+shift+4"] # tmux: prefix $
rename_tab       = ["prefix+shift+t", "prefix+comma"]   # tmux: prefix ,
detach           = ["prefix+q", "prefix+d"]             # tmux: prefix d
workspace_picker = ["prefix+w", "prefix+s"]             # tmux: prefix s
close_tab        = ["prefix+shift+x", "prefix+shift+7"] # tmux: prefix &
split_horizontal = ["prefix+minus", "prefix+'"]         # tmux: prefix ' (top/bottom)
split_vertical   = ["prefix+v", 'prefix+"']             # tmux: prefix " (side-by-side)
settings         = "prefix+shift+s"

# prefix+f is the fzf goto with a pane preview (below); the built-in goto still
# covers tabs and workspaces that have no pane to preview.
goto = "prefix+shift+f"


# nvim<->herdr navigation (ctrl+hjkl) and resize (alt+hjkl) via the
# herdr-splits plugin; the nvim half is nvim/lua/plugins/tools/herdr-splits.lua.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left"
[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down"
[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up"
[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right"
[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left"
[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down"
[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up"
[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right"

# one-percent resize
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize-fine.sh" left'
description = "resize left (fine)"
[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize-fine.sh" down'
description = "resize down (fine)"
[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize-fine.sh" up'
description = "resize up (fine)"
[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize-fine.sh" right'
description = "resize right (fine)"

# tmux: prefix B = break-pane (herdr has no built-in action, so call the CLI)
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "break pane to new tab"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" goto'
description = "goto pane (preview)"
width = "70%"
height = "60%"

# tmux: prefix m/M = choose-window -> join-pane; fzf picker pulls a pane in
[[keys.command]]
key = "prefix+m"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" join right'
description = "join a pane (split right)"
width = "70%"
height = "60%"
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" join down'
description = "join a pane (split down)"
width = "70%"
height = "60%"

# tmux: prefix space = next-layout (cycles even-v, even-h, main-left, main-top, tiled)
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "layouts.cycle"
description = "cycle layout"

# edit_scrollback, unless the pane has nothing to scroll back to (tmux: prefix /)
[[keys.command]]
key = "prefix+e"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-scrollback.sh"'
description = "scrollback in $EDITOR"
[[keys.command]]
key = "prefix+slash"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-scrollback.sh"'
description = "scrollback in $EDITOR"

# Reload with the result shown in the tab bar; the built-in reload_config on
# the same key is silent.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-reload.sh"'
description = "reload config"

# lazygit popup from plugins/lazygit; nvim's <leader>gg opens the same pane.
# prefix+l is left to herdr's default focus_pane_right.
[[keys.command]]
key = "prefix+g"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin lazygit --entrypoint lazygit --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "lazygit"

# session save/restore (tmux-resurrect: prefix C-s save, prefix C-r restore)
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save"
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore"

[ui]
pane_gaps = false
toast.delivery = "system"

# Tab bar right side (tmux status-right equivalent). Separate command entries
# so each refreshes at its own pace.
tab_bar_right = [
    { type = "command", command = "$HOME/.config/herdr/bin/herdr-reload-status.sh", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.config/herdr/bin/herdr-netspeed.sh", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.config/herdr/bin/herdr-sysmon.sh", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.config/herdr/bin/herdr-weather.sh", interval_seconds = 900, timeout_seconds = 10 },
    { type = "datetime", format = "%H:%M " },
]
tab_bar_right_separator = " · "

agent_panel_sort = "priority"
[theme]
name = "catppuccin-mocha"
auto_switch = true

[experimental]
pane_history = true

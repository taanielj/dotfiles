# yaml-language-server: $schema=https://raw.githubusercontent.com/razajamil/herdr-plugin-workspace-manager/main/schema.json
layouts:
  - id: dev
    tabs:
      - title: code
        panes:
          - title: editor
            command: nvim
          - title: claude
            agent: claude
            split: vertical
            size: "45%"
      - title: shell
        panes:
          - title: shell
  # A Claude subagent's worktree gets a shell instead of Claude, because the
  # subagent already runs in the parent session.
  - id: agent
    tabs:
      - title: code
        panes:
          - title: editor
            command: nvim
          - title: shell
            split: vertical
            size: "40%"

globalLayout: dev
workspaces:
  - path: ~/git
    defaultLayout: dev
    layoutMatching:
      - title: Claude subagent worktrees
        worktreePattern: worktree-agent-*
        layout: agent

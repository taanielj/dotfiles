# Only bindings that differ from herdr's defaults are set. herdr's defaults
# already match tmux for prefix+c (new tab), prefix+shift+n (new workspace) and
# prefix+shift+t / prefix+shift+w (rename tab / workspace).

onboarding = false

[terminal]
shell_mode = "auto"
kitty_graphics = true

[session]
resume_agents_on_restore = true

[keys]
prefix = "ctrl+space"


# tmux: M-Left/M-Right = previous/next window
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

next_workspace     = "alt+down"
previous_workspace = "alt+up"
next_agent         = "alt+shift+down"
previous_agent     = "alt+shift+up"

# --- tmux muscle-memory aliases (secondary keys; prune once the herdr defaults stick) ---
rename_workspace = ["prefix+shift+w", "prefix+shift+4"] # tmux: prefix $
rename_tab       = ["prefix+shift+t", "prefix+comma"]   # tmux: prefix ,
detach           = ["prefix+q", "prefix+d"]             # tmux: prefix d
workspace_picker = ["prefix+w", "prefix+s"]             # tmux: prefix s
close_tab        = ["prefix+shift+x", "prefix+shift+7"] # tmux: prefix &
split_horizontal = ["prefix+minus", "prefix+'"]         # tmux: prefix ' (top/bottom)
split_vertical   = ["prefix+v", 'prefix+"']             # tmux: prefix " (side-by-side)
settings         = "prefix+shift+s"                     # frees prefix+s for workspace_picker

# prefix+f runs herdr-pane-pick.sh's goto, which previews each pane. The built-in
# goto also lists tabs and workspaces with no pane to preview.
goto = "prefix+shift+f"


# ctrl+hjkl moves focus and alt+hjkl resizes across Neovim splits, herdr panes
# and macOS windows. The Neovim side is nvim/lua/plugins/tools/herdr-splits.lua.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" left'
description = "navigate left"
[[keys.command]]
key = "ctrl+j"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" down'
description = "navigate down"
[[keys.command]]
key = "ctrl+k"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" up'
description = "navigate up"
[[keys.command]]
key = "ctrl+l"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" right'
description = "navigate right"
[[keys.command]]
key = "ctrl+shift+h"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" left window'
description = "window left"
[[keys.command]]
key = "ctrl+shift+j"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" down window'
description = "window down"
[[keys.command]]
key = "ctrl+shift+k"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" up window'
description = "window up"
[[keys.command]]
key = "ctrl+shift+l"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-nav.sh" right window'
description = "window right"
[[keys.command]]
key = "alt+h"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" left'
description = "resize left"
[[keys.command]]
key = "alt+j"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" down'
description = "resize down"
[[keys.command]]
key = "alt+k"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" up'
description = "resize up"
[[keys.command]]
key = "alt+l"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" right'
description = "resize right"

[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" left fine'
description = "resize left (fine)"
[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" down fine'
description = "resize down (fine)"
[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" up fine'
description = "resize up (fine)"
[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-resize.sh" right fine'
description = "resize right (fine)"

# tmux: prefix B = break-pane (herdr has no built-in action, so call the CLI)
[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'
description = "break pane to new tab"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" goto'
description = "goto pane (preview)"
width = "70%"
height = "60%"

# tmux: prefix m/M = choose-window -> join-pane
[[keys.command]]
key = "prefix+m"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" join right'
description = "join a pane (split right)"
width = "70%"
height = "60%"
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = 'bash "$HOME/.config/herdr/bin/herdr-pane-pick.sh" join down'
description = "join a pane (split down)"
width = "70%"
height = "60%"

[[keys.command]]
key = "prefix+shift+y"
type = "popup"
command = "herdr-sync tui"
description = "replace everything with the Herdr app's spaces"
width = "60%"
height = "60%"

# tmux: prefix space = next-layout (side by side, stacked, main left, main top, tiled)
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "layouts.cycle"
description = "cycle layout"

# tmux: prefix /
[[keys.command]]
key = "prefix+e"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-scrollback.sh"'
description = "scrollback in $EDITOR"
[[keys.command]]
key = "prefix+slash"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-scrollback.sh"'
description = "scrollback in $EDITOR"

# herdr's own reload_config on this key shows no result. This one reports the
# result in the tab bar.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = 'bash "$HOME/.config/herdr/bin/herdr-reload.sh"'
description = "reload config"

[[keys.command]]
key = "prefix+g"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" plugin pane open --plugin lazygit --entrypoint lazygit --cwd "$HERDR_ACTIVE_PANE_CWD" --focus'
description = "lazygit"

# session save/restore (tmux-resurrect: prefix C-s save, prefix C-r restore)
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "resurrect: save"
[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "resurrect: restore"

[ui]
pane_gaps = false
# hammerspoon/init.lua tells windows running herdr apart by this prefix
window_title = "herdr · {workspace}"
host_cursor = "native"
toast.delivery = "system"

# tmux: status-right
tab_bar_right = [
    { type = "command", command = "$HOME/.config/herdr/bin/herdr-reload-status.sh", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.local/bin/herdr-netspeed tui", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.local/bin/herdr-sysmon", interval_seconds = 1, timeout_seconds = 2 },
    { type = "command", command = "$HOME/.local/bin/herdr-weather", interval_seconds = 900, timeout_seconds = 10 },
    { type = "datetime", format = "%H:%M " },
]
tab_bar_right_separator = " · "

agent_panel_sort = "priority"

# Each row names its workspace, because the priority sort mixes agents from
# different workspaces.
[ui.sidebar.agents]
rows = [
    ["state_icon", "workspace", "tab"],
    ["$title"], # session title when agents share a tab, from plugins/agent-titles
    [{ token = "machine", rules = [{ equals = "Local", hide = true }] }],
]

[ui.sidebar.spaces]
rows = [
    ["state_icon", "workspace", "$tab"], # active tab when named, from plugins/active-tab
    ["branch", "git_status"],
]

[theme]
name = "catppuccin"
auto_switch = false

[experimental]
pane_history = true

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

# The base config. generate-config.zsh generates the config starship reads from
# this file and the STARSHIP_* options (settings.zsh): it sets palette, moves
# right_format's modules and the command line as the options say and, for
# STARSHIP_LOOK=segments, restyles the modules.
#
# Colours by role: "p10k" keeps p10k's 256-colour defaults, "catppuccin" (macchiato)
# matches the terminal and nvim, "gruvbox" is gruvbox dark. zsh reads the palette
# too, for the path, the frame and the segments' caps.
palette = "catppuccin"

# Listing the modules keeps starship's per-language modules off. The generator
# replaces format's `$line_break$character` ending.
format = "${env_var.STARSHIP_GIT_HOST_ICON}$git_branch$git_commit$git_state$git_status$line_break$character"
right_format = "$status$cmd_duration$jobs${env_var.DIRENV_DIR}$python$kubernetes$aws$gcloud$username$hostname$time"

# Each icon is followed by a space because the terminal draws a wide icon across two cells when the next cell is empty.
# An icon followed by text shrinks to one cell.

# path.zsh renders this module once at startup and draws the path itself.
[os]
disabled = false
style = "fg:os"
format = "[$symbol]($style) "

[os.symbols]
Macos = "\uF179"
Debian = "\uF306"
Ubuntu = "\uF31B"
Linux = "\uF17C"
Android = "\uF17B"

# p10k's VCS icon, the origin remote's host, set on cd by module-variables.zsh
[env_var.STARSHIP_GIT_HOST_ICON]
style = "fg:git"
format = "[$env_value ]($style)"

[git_branch]
symbol = "\uF126 "
style = "fg:git"
format = "[$symbol$branch]($style) "

# Shown only on a detached HEAD, as @hash or #tag
[git_commit]
style = "fg:git"
format = "[@$hash$tag]($style) "
commit_hash_length = 8
tag_disabled = false
tag_symbol = " #"

[git_state]
style = "fg:error"
format = "[$state( $progress_current/$progress_total)]($style) "

[git_status]
format = "$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked"
ahead = "[⇡$count](fg:git) "
behind = "[⇣$count](fg:git) "
diverged = "[⇣$behind_count ⇡$ahead_count](fg:git) "
stashed = "[*$count](fg:git) "
conflicted = "[~$count](fg:error) "
staged = "[+$count](fg:git_changed) "
modified = "[!$count](fg:git_changed) "
renamed = "[»$count](fg:git_changed) "
deleted = "[✘$count](fg:git_changed) "
untracked = "[?$count](fg:git_untracked) "

[character]
success_symbol = "[❯](fg:git)"
error_symbol = "[❯](fg:error)"

[status]
disabled = false
style = "fg:status"
format = "[✘$status]($style) "
pipestatus = true
pipestatus_format = "[✘$pipestatus]($style) "
pipestatus_segment_format = "$status"

[cmd_duration]
min_time = 3000
style = "fg:duration"
format = "[\uF252 $duration]($style) "

[jobs]
symbol = "\uF013 "
style = "fg:jobs"
format = "[$symbol]($style) "

[env_var.DIRENV_DIR]
style = "fg:direnv"
format = "[▼]($style) "

# Only an active venv, without the Python version
[python]
symbol = "\uE73C "
style = "fg:python"
format = "[$symbol$virtualenv]($style) "
detect_extensions = []
detect_files = []
detect_folders = []

# STARSHIP_KUBE and STARSHIP_GCLOUD are set while the typed command needs them (module-variables.zsh).
[kubernetes]
disabled = false
detect_env_vars = ["STARSHIP_KUBE"]
symbol = "󱃾 "
style = "fg:kube"
format = "[$symbol$context(/$namespace)]($style) "

# EKS and GKE context names spell out account and region; show the cluster only
[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[^:]+:[^:]+:cluster/(?P<cluster>.+)"
context_alias = "$cluster"

[[kubernetes.contexts]]
context_pattern = "gke_[^_]+_[^_]+_(?P<cluster>.+)"
context_alias = "$cluster"

[gcloud]
detect_env_vars = ["STARSHIP_GCLOUD"]
symbol = "󰊭 "
style = "fg:gcloud"
format = "[$symbol$project]($style) "

[aws]
symbol = "\uF270 "
style = "fg:aws"
format = "[$symbol$profile( $region)]($style) "

[username]
style_user = "fg:user"
style_root = "bold fg:root"
format = "[$user]($style)"

[hostname]
style = "fg:user"
format = "[@$hostname]($style) "

[time]
disabled = false
style = "fg:time"
time_format = "%H:%M:%S"
format = "[\uF017 $time]($style)"


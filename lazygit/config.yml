git:
  diffRenderers:
    # delta ignores the COLUMNS lazygit sets for the panel width
    # Without delta, lazygit would show an empty diff, so pass git's diff through instead
    - command: >-
        if command -v delta >/dev/null; then delta --config ~/.config/delta/config --width=$COLUMNS;
        else echo "delta not installed, showing plain diff"; cat; fi
    - command: >-
        if command -v delta >/dev/null; then delta --config ~/.config/delta/config --width=$COLUMNS --side-by-side;
        else echo "delta not installed, showing plain diff"; cat; fi
      name: side-by-side

customCommands:
  - key: 'o'
    context: 'localBranches'
    description: 'Open pull/merge request in browser (existing one, else new; repo on main)'
    command: >-
      O() { if [ -n "$WSL_DISTRO_NAME" ]; then explorer.exe "$1" || true;
      elif command -v xdg-open >/dev/null 2>&1; then xdg-open "$1"; else open "$1"; fi; };
      B={{.SelectedLocalBranch.Name | quote}};
      U=$(git remote get-url origin | sed -E 's#^git@([^:]+):#https://\1/#; s#\.git$##');
      case "$B" in main|master) O "$U"; exit ;; esac;
      H=$(printf '%s\n' "$U" | sed -E 's#^[a-z]+://##; s#^[^@/]*@##; s#[/:].*##');
      if command -v glab >/dev/null 2>&1 && [ -n "$(glab config get token --host "$H" 2>/dev/null)" ]; then
      glab mr view --web "$B" 2>/dev/null || O "$U/-/merge_requests/new?merge_request[source_branch]=$B"; exit; fi;
      case "$U" in
      *github*) if command -v gh >/dev/null 2>&1; then gh pr view --web "$B" 2>/dev/null || gh pr create --web --head "$B"; else O "$U/compare/$B?expand=1"; fi ;;
      *) O "$U/compare/$B?expand=1" ;;
      esac
    output: log
  - key: 'O'
    context: 'localBranches'
    description: 'Log the newest pull/merge request of each local branch'
    command: >-
      U=$(git remote get-url origin | sed -E 's#^git@([^:]+):#https://\1/#; s#\.git$##');
      H=$(printf '%s\n' "$U" | sed -E 's#^[a-z]+://##; s#^[^@/]*@##; s#[/:].*##');
      if command -v glab >/dev/null 2>&1 && [ -n "$(glab config get token --host "$H" 2>/dev/null)" ]; then
      glab mr list --all --per-page 100 -F json --jq '.[] | select(.source_project_id == .target_project_id) | "\(.source_branch)\t!\(.iid) \(.state)\t\(.title)"';
      else gh pr list --state all --limit 100 --json headRefName,isCrossRepository,number,state,title --jq '.[] | select(.isCrossRepository | not) | "\(.headRefName)\t#\(.number) \(.state)\t\(.title)"'; fi |
      while IFS="$(printf '\t')" read -r B N T; do
      case " $SEEN " in *" $B "*) continue ;; esac; SEEN="$SEEN $B";
      if git show-ref --quiet --verify "refs/heads/$B"; then printf '%s  %s  %s\n' "$N" "$B" "$T"; fi; done
    output: log
